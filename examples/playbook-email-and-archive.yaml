start: "2021-09-15T10:00:00Z"
actors:
  - name: insider
    base: users/bob

steps:
  # Create emails and images, then bundle in an archive
  - actor: insider
    offset: 0s
    actions:
      - action: create
        type: dir
        path: mail
      - action: create
        path: mail/msg-${SEQ}.eml
        id: mail
        format: text   # placeholder text, not a real file of this type
        content_len: 400
      - action: create
        path: media/pic-${SEQ}.jpg
        id: media
        format: text   # placeholder text, not a real file of this type
        content_len: 256

  - actor: insider
    offset: 20m
    actions:
      - action: create
        path: bundles/bundle.zip
        format: text   # placeholder text, not a real file of this type
        content_len: 2048

  # Clean up originals to look like staging/exfil
  - actor: insider
    offset: 30m
    actions:
      # The originals are named by id: ${SEQ} has moved on since they were
      # created, so repeating their path template would name different files.
      - action: delete
        refs: mail
      - action: delete
        refs: media

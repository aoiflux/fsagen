start: "2021-09-15T10:00:00Z"
actors:
  - name: insider
    base: users/bob

steps:
  # Real messages and real images, then a real archive of both.
  - actor: insider
    offset: 0s
    actions:
      - action: create
        type: dir
        path: mail
      - action: email
        path: mail/msg-${SEQ}.eml
        id: mail
        email:
          from: bob@example.com
          to: ["personal-${SEQ}@mail.example"]
          subject: "Handover notes ${SEQ}"
          body_text: |
            Notes from today, as discussed.
      - action: create
        path: media/pic-${SEQ}.jpg
        id: media
        content_len: 256

  - actor: insider
    offset: 20m
    actions:
      # The members are named by id, so the archive holds exactly what was
      # created above however the names were generated.
      - action: archive
        path: bundles/bundle.zip
        archive:
          base: .
          comment: staged for transfer
          member_refs:
            - mail
            - media

  # Clean up originals to look like staging/exfil
  - actor: insider
    offset: 30m
    actions:
      # The originals are named by id: ${SEQ} has moved on since they were
      # created, so repeating their path template would name different files.
      - action: delete
        refs: mail
      - action: delete
        refs: media

# Browser-history artifacts: real Chrome and Firefox databases.
#
# Each engine keeps its own tables and, more importantly, its own epoch:
# Chrome counts microseconds from 1601-01-01 and Firefox from 1970-01-01. The
# visits below read back as the times written here in either tool.
operations:
  - action: create
    type: dir
    path: Chrome/Default

  - action: create
    path: Chrome/Default/History
    format: chrome_history
    mtime: "2023-10-30T14:00:00Z"
    atime: "2023-10-30T14:30:00Z"
    history:
      visits:
        - url: https://intranet.example/hr/handbook
          title: Employee handbook
          time: "2023-10-30T09:12:00Z"
          transition: typed
        - url: https://intranet.example/hr/handbook/leave
          title: Leave policy
          time: "2023-10-30T09:13:20Z"
          from_visit: 1
        - url: https://search.example/?q=export+customer+list
          title: export customer list - Search
          time: "2023-10-30T13:58:00Z"
          transition: typed
      downloads:
        - url: https://intranet.example/hr/handbook.pdf
          target_path: C:\Users\analyst\Downloads\handbook.pdf
          start: "2023-10-30T09:14:00Z"
          end: "2023-10-30T09:14:03Z"
          received_bytes: 284160
          total_bytes: 284160
          mime_type: application/pdf

  - action: create
    type: dir
    path: Firefox/Profiles/default

  - action: create
    path: Firefox/Profiles/default/places.sqlite
    format: firefox_places
    mtime: "2023-10-30T15:00:00Z"
    atime: "2023-10-30T15:30:00Z"
    history:
      visits:
        - url: https://news.example/world
          title: World news
          time: "2023-10-30T12:00:00Z"
        - url: https://news.example/world
          title: World news
          time: "2023-10-30T12:40:00Z"
          transition: reload
        - url: https://mail.example/inbox
          title: Inbox
          time: "2023-10-30T14:45:00Z"
          transition: bookmark

start: "2021-01-01T09:00:00Z"
actors:
  - name: user1
    base: users/user1
  - name: user2
    base: users/user2

steps:
  - actor: user1
    offset: 0s
    every: 15m
    repeat: 2
    actions:
      - action: create
        path: docs/report-${ITER}.txt
        content: "Quarterly report ${SEQ} - ${RND:16}"
        offset: 0s
      - action: update
        path: docs/report-${ITER}.txt   # the report this iteration created
        content_len: 64
        offset: 5m

  - actor: user2
    offset: 30m
    actions:
      - action: create
        type: dir
        path: media/photos
      - action: create
        path: media/photos/pic-${SEQ}.jpg
        id: photo
        content_len: 256
        offset: 2m
      - action: delete
        ref: photo   # ${SEQ} has moved on by now, so name the file by its id
        offset: 10m

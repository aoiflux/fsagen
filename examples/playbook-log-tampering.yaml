start: "2021-07-01T00:00:00Z"
actors:
  - name: attacker
    base: systems/server01

steps:
  # Legitimate baseline log stream
  - actor: attacker
    offset: 0s
    actions:
      # append creates the log on its first write.
      - action: append
        path: var/log/app.jsonl
        content: |
          {"ts":"${DATE:2006-01-02T15:04:05Z07:00}","level":"info","msg":"service start"}

  # Tampering: inject fake entries, then backdate file
  - actor: attacker
    offset: 30m
    every: 5m
    repeat: 3
    actions:
      - action: append
        path: var/log/app.jsonl
        content: |
          {"ts":"${DATE:2006-01-02T15:04:05Z07:00}","level":"warn","user":"${RND:6}","msg":"unexpected input"}
      - action: mace
        path: var/log/app.jsonl
        atime: "2021-06-15T12:00:00Z"
        mtime: "2021-06-15T12:00:00Z"

  # Anti-forensics: cut the injected lines back out, leaving a gap in the
  # record rather than an obviously truncated file.
  - actor: attacker
    offset: 1h
    actions:
      - action: edit
        path: var/log/app.jsonl
        mtime: "2021-06-15T12:00:00Z"
        atime: "2021-06-15T12:00:00Z"
        edit:
          delete_matching: '"level":"warn"'

  # Cleanup: delete the log after a period
  - actor: attacker
    offset: 2h
    actions:
      - action: delete
        path: var/log/app.jsonl
        atime: "2021-06-01T00:00:00Z"
        mtime: "2021-06-01T00:00:00Z"

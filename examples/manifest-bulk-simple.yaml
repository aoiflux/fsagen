operations:
  # The same executables and messages deployed across several computers.
  # The .exe files are real PE images (headers, sections, imports, a version
  # resource) holding no code, and the .eml files are real RFC 5322 messages.

  # === COMPUTER-01 ===
  - action: create
    type: dir
    path: computer-01

  - action: create
    type: dir
    path: computer-01/program-files

  - action: create
    type: dir
    path: computer-01/mail

  - action: create
    type: dir
    path: computer-01/temp

  # Consistent executable files across systems
  - action: create
    path: computer-01/program-files/update-tool.exe
    content_len: 2048
    mtime: "2024-10-15T09:30:00Z"

  - action: create
    path: computer-01/program-files/system-monitor.exe
    content_len: 4096
    mtime: "2024-10-15T09:30:15Z"

  - action: create
    path: computer-01/temp/installer-${SEQ}.exe
    content_len: 1536
    mtime: "2024-10-15T10:15:00Z"

  # Email files with consistent naming
  - action: email
    path: computer-01/mail/notification-001.eml
    mtime: "2024-10-15T08:45:00Z"
    email:
      from: it-notifications@example.com
      to: ["ops@example.com"]
      subject: "Deployment notice: notification-001"
      body_text: |
        The update service completed a scheduled deployment.

  - action: email
    path: computer-01/mail/alert-system.eml
    mtime: "2024-10-15T09:00:00Z"
    email:
      from: it-notifications@example.com
      to: ["ops@example.com"]
      subject: "Deployment notice: alert-system"
      body_text: |
        The update service completed a scheduled deployment.

  - action: email
    path: computer-01/mail/update-${SEQ}.eml
    mtime: "2024-10-15T11:30:00Z"
    email:
      from: it-notifications@example.com
      to: ["ops@example.com"]
      subject: "Deployment notice: update-${SEQ}"
      body_text: |
        The update service completed a scheduled deployment.


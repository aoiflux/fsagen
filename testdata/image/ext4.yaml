# A scenario that takes an ext4 image through everything its driver does:
# times to the nanosecond and past 2038, a directory grown past its first
# block, deletes that wipe the entry and leave the inode and its blocks,
# an inode reused once a minute has passed and not before, hard links and
# symlinks kept in the inode and in a block, renames across directories,
# an update and a truncate that free blocks, and slack. TestExt4ImageGolden
# pins the image it makes, byte for byte. It deletes no directory: The
# Sleuth Kit lists no orphan inode at all once one is (see docs/testing.md).

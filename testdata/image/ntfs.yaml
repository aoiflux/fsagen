# A scenario that takes an NTFS image through everything its driver does:
# content kept in its MFT record and content in clusters, content that
# outgrows its record and never comes back, a directory whose entries
# outgrow its record and move to an index block, names in the Win32 and DOS
# namespaces and in the Win32 one alone, Unicode names, deletes that leave
# their records, runlists and index slack behind, a record a later file
# takes back, renames within and between directories, an update, an append,
# a truncate and a copy, a read-only file, a timestomp, and times to 100 ns.
# TestNTFSImageGolden pins the image it makes, byte for byte.
start: "2023-03-01T09:00:00Z"
operations:

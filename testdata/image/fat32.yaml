# A scenario that takes a FAT32 image through everything its driver does:
# long names and the short names Windows gives them (~1 to ~4, then the
# checksum form), names kept by case bits alone, a directory grown past its
# first cluster, deletes and renames that leave entries behind, an update
# and a truncate that free clusters, and slack. TestImageGolden pins the
# image it makes, byte for byte.
